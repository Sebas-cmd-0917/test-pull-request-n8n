# Detector automatico de conflictos entre ramas.
# La logica vive en el repo central fulservice-ci; este archivo solo la llama.
# Requiere el secret DISCORD_WEBHOOK_URL (Settings > Secrets and variables > Actions).
name: Detectar conflictos

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  push:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: conflictos-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  conflictos:
    # En pushes solo corre si es la rama principal del repo (main, master, develop... la que sea)
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    uses: Sebas-cmd-0917/fulservice-ci/.github/workflows/detectar-conflictos.yml@main
    secrets: inherit
