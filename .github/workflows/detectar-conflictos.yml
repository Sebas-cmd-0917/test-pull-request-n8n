# Detector automatico de conflictos entre ramas.
# UN SOLO ARCHIVO: copialo tal cual a cualquier repo en
#   .github/workflows/detectar-conflictos.yml   (y subelo a la rama principal)
# y crea el secret DISCORD_WEBHOOK_URL en Settings > Secrets and variables > Actions.
#
# Se dispara con cada "git push" (no hacen falta Pull Requests):
#  - Push de una rama de trabajo: prueba el merge real contra la rama principal y contra
#    las demas ramas activas. Si choca, avisa a Discord con archivo y lineas.
#  - Push a la rama principal (algo se integro): avisa que ramas quedaron en conflicto.
# Funciona con cualquier nombre de rama principal (main, master, develop...).
# Nota: una rama creada ANTES de agregar este archivo debe traer la rama principal
# (git merge main) para empezar a ser revisada.
name: Detectar conflictos

on:
  push:
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: conflictos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conflictos:
    if: github.event.deleted != true
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repo (historial completo)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Revisar conflictos y avisar a Discord
        env:
          REPO: ${{ github.repository }}
          PRINCIPAL: ${{ github.event.repository.default_branch }}
          RAMA: ${{ github.ref_name }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          # Detecta conflictos REALES de git (archivo + lineas) y avisa a Discord.
          # Se dispara con cada "git push" (no hacen falta Pull Requests):
          #  - Push de una rama de trabajo: prueba integrarla en la rama principal y contra las
          #    demas ramas activas. Si choca con la principal, la corrida queda en rojo.
          #  - Push a la rama principal: revisa que ramas activas quedaron en conflicto.
          # GitHub Actions ejecuta con "bash -e": aqui se desactiva porque un conflicto detectado
          # (codigo 1) es un resultado esperado, no un error del script.
          set +e
          set -uo pipefail

          REPO="${REPO:?falta REPO}"
          PRINCIPAL="${PRINCIPAL:?falta PRINCIPAL}"
          RAMA="${RAMA:?falta RAMA}"
          SERVER="${GITHUB_SERVER_URL:-https://github.com}"
          DIAS="${DIAS_ACTIVAS:-30}"      # ramas sin commits en este tiempo se ignoran

          git config user.email "conflictos@bot.local"
          git config user.name "detector-conflictos"
          git fetch -q --prune origin '+refs/heads/*:refs/remotes/origin/*'

          autor() { git log -1 --format='%an' "origin/$1" 2>/dev/null; }

          # Ramas activas: no la principal, no integradas todavia, con commits recientes
          activas() {
            local ahora b ts
            ahora="$(date +%s)"
            git for-each-ref --format='%(refname)' refs/remotes/origin | sed 's#^refs/remotes/origin/##' | while IFS= read -r b; do
              [ "$b" = "HEAD" ] && continue
              [ "$b" = "$PRINCIPAL" ] && continue
              git merge-base --is-ancestor "origin/$b" "origin/$PRINCIPAL" 2>/dev/null && continue
              ts="$(git log -1 --format=%ct "origin/$b" 2>/dev/null)"
              [ -z "$ts" ] && continue
              [ $(( ahora - ts )) -gt $(( DIAS * 86400 )) ] && continue
              printf '%s\n' "$b"
            done
          }

          # simulate <base> <pre|""> <candidata>
          #   Integra <pre> (si se da) y luego prueba integrar <candidata>.
          #   Imprime los archivos en conflicto con sus lineas. rc: 0 limpio, 1 conflicto, 2 no aplica.
          simulate() {
            local base="$1" pre="$2" cand="$3" wt files f lines out="" rc=0
            wt="$(mktemp -d)"
            if ! git worktree add -q --detach "$wt" "$base" >/dev/null 2>&1; then rm -rf "$wt"; return 2; fi
            if [ -n "$pre" ] && ! git -C "$wt" merge -q --no-edit "$pre" >/dev/null 2>&1; then
              git -C "$wt" merge --abort >/dev/null 2>&1
              git worktree remove --force "$wt" >/dev/null 2>&1; rm -rf "$wt"; return 2
            fi
            git -C "$wt" merge --no-commit --no-ff "$cand" >/dev/null 2>&1
            files="$(git -C "$wt" diff --name-only --diff-filter=U)"
            if [ -n "$files" ]; then
              rc=1
              while IFS= read -r f; do
                [ -z "$f" ] && continue
                lines="$(awk '/^<<<<<<< /{s=NR} /^>>>>>>> /{printf "%s%d-%d", sep, s, NR; sep=", "}' "$wt/$f" 2>/dev/null)"
                if [ -n "$lines" ]; then
                  out+="   - \`$f\` (lineas $lines)"$'\n'
                else
                  out+="   - \`$f\` (archivo binario o no UTF-8, sin numeros de linea)"$'\n'
                fi
              done <<< "$files"
            fi
            git -C "$wt" merge --abort >/dev/null 2>&1
            git worktree remove --force "$wt" >/dev/null 2>&1; rm -rf "$wt"
            printf '%s' "$out"
            return $rc
          }

          notify() {
            local url code
            # tolera espacios, saltos de linea o comillas pegados por error en el secret
            url="$(printf '%s' "${DISCORD_WEBHOOK_URL:-}" | tr -d ' \r\n"'"'"'')"
            if [ -z "$url" ]; then
              echo "::warning::Falta el secret DISCORD_WEBHOOK_URL: no se envio el aviso a Discord."
              return
            fi
            code="$(jq -n --arg c "${1:0:1900}" '{content: $c, allowed_mentions: {parse: []}}' \
              | curl -sS -o /dev/null -w '%{http_code}' -X POST -H "Content-Type: application/json" -d @- "$url" 2>/dev/null)"
            if [ "${code:0:1}" = "2" ]; then
              echo "Aviso enviado a Discord (HTTP $code)."
            else
              echo "::warning::Discord no acepto el aviso (HTTP ${code:-sin respuesta}). Revisa el valor del secret DISCORD_WEBHOOK_URL."
            fi
          }

          ACTIVAS="$(activas)"

          # ---------- Push de una rama de trabajo ----------
          if [ "$RAMA" != "$PRINCIPAL" ]; then
            MSG=""; BLOQUEA=0
            out="$(simulate "origin/$PRINCIPAL" "" "origin/$RAMA")"; rc=$?
            if [ $rc -eq 1 ]; then
              BLOQUEA=1
              MSG+="🔴 Choca con \`$PRINCIPAL\`:"$'\n'"$out"$'\n'
            else
              # Solo se compara contra otras ramas si esta limpia contra la principal
              while IFS= read -r otra; do
                [ -z "$otra" ] && continue
                [ "$otra" = "$RAMA" ] && continue
                out="$(simulate "origin/$PRINCIPAL" "origin/$otra" "origin/$RAMA")"; rc=$?
                if [ $rc -eq 1 ]; then
                  MSG+="🟠 Choca con la rama \`$otra\` (de $(autor "$otra")) si se integra despues de esa:"$'\n'"$out"$'\n'
                fi
              done <<< "$ACTIVAS"
            fi

            if [ -n "$MSG" ]; then
              FULL="⚠️ **Conflicto de ramas** — $REPO"$'\n'
              FULL+="Rama \`$RAMA\` (de $(autor "$RAMA")): $SERVER/$REPO/tree/$RAMA"$'\n'
              FULL+="$MSG""No integrar hasta coordinar con el otro dueño de rama."
              echo "$FULL"
              notify "$FULL"
              if [ $BLOQUEA -eq 1 ]; then
                echo "::error::La rama $RAMA choca con $PRINCIPAL. Actualizala y resuelve antes de integrar."
                exit 1
              fi
              echo "::warning::La rama $RAMA choca con otras ramas activas (ver aviso en Discord)."
            else
              echo "Sin conflictos: $RAMA no choca con $PRINCIPAL ni con otras ramas activas."
            fi
            exit 0
          fi

          # ---------- Push a la rama principal: algo se integro ----------
          MSG=""
          while IFS= read -r b; do
            [ -z "$b" ] && continue
            out="$(simulate "origin/$PRINCIPAL" "" "origin/$b")"; rc=$?
            if [ $rc -eq 1 ]; then
              MSG+="- \`$b\` (de $(autor "$b")): $SERVER/$REPO/tree/$b"$'\n'"$out"$'\n'
            fi
          done <<< "$ACTIVAS"

          if [ -n "$MSG" ]; then
            FULL="⚠️ **Tras el ultimo cambio en \`$PRINCIPAL\`** ($REPO), estas ramas ahora chocan:"$'\n'"$MSG"
            FULL+="Sus dueños deben actualizar la rama con \`$PRINCIPAL\` y resolver."
            echo "$FULL"
            notify "$FULL"
          else
            echo "Ninguna rama activa choca con $PRINCIPAL."
          fi
          exit 0
